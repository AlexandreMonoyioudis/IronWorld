# Planets
planet.ironworld.name = Железный мир

# Sectors
sector.ironworld-Impact-Crater.name = Ударный кратер
sector.ironworld-Impact-Crater.description = Начало вашего путешествия по спутнику IronWorld. Захватите этот сектор и освоите первые технологии.
sector.ironworld-Iron-Mounds.name = Железные холмы
sector.ironworld-Iron-Mounds.description = Захватите этот сектор, чтобы закрепиться на IronWorld.
sector.ironworld-Foothold.name = Опорная база
sector.ironworld-Foothold.description = Очистите этот сектор от контроля Кракса.
sector.ironworld-Choke-Hold.name = Тиски
sector.ironworld-StareDown.name = Схватка взглядов
sector.ironworld-Magma-Field.name = Магмовое поле

# Cores
block.ironworld-core-cage.name = Ядро «Клетка»
block.ironworld-core-cage.description = Ядро базы. При уничтожении сектора сектор считается потерянным.

# Items
item.ironworld-Iron.name = Железо
item.ironworld-Iron.description = Само по себе мало пригодно, но является основой для большинства сплавов.
item.ironworld-Cobalt.name = Кобальт
item.ironworld-Cobalt.description = Полезный металл, сохраняющий прочность при высоких температурах.
item.ironworld-Black-Steel.name = Чёрная сталь
item.ironworld-Black-Steel.description = Прочный сплав кобальта и шлака, очищенный с помощью воздуха.
item.ironworld-Permendur.name = Пермендюр
item.ironworld-Permendur.description = Сплав для электромагнитных применений.
item.ironworld-gravel.name = Гравий
item.ironworld-gravel.description = Сыпучий камень с острыми краями и кремниевыми вкраплениями, добываемый из гравийной поверхности. Прессуется со шлаком в металлический цемент.
item.ironworld-metal-cement.name = Металлический цемент
item.ironworld-metal-cement.description = Плотное связующее, получаемое прессованием гравия со шлаком. Используется вместо чёрной стали в тяжёлых постройках.

# Liquids
liquid.ironworld-wind-air.name = Воздух
liquid.ironworld-wind-air.description = Газ, содержащийся в атмосфере.
liquid.slag.name = Шлак
liquid.slag.description = Смесь расплавленных металлов.

# Distribution
block.ironworld-iron-conveyor.name = Железный конвейер
block.ironworld-iron-conveyor.description = Перемещает предметы вперёд.
block.ironworld-industrial-conveyor.name = Промышленный конвейер
block.ironworld-industrial-conveyor.description = Перемещает предметы партиями по 10 со скоростью вдвое ниже пластиниевого конвейера. Загрузка и выгрузка происходят с концов.
block.ironworld-metal-junction.name = Металлический перекрёсток
block.ironworld-metal-junction.description = Позволяет конвейерам пересекаться, не смешивая предметы на лентах.
block.ironworld-metal-router.name = Металлический маршрутизатор
block.ironworld-metal-router.description = Распределяет предметы по соседним блокам по очереди.
block.ironworld-metal-bridge.name = Металлический мостовой конвейер
block.ironworld-metal-bridge.description = Перемещает предметы через промежутки к связанному мостовому конвейеру.
block.ironworld-metal-sorter.name = Металлический сортировщик
block.ironworld-metal-sorter.description = Передаёт выбранные предметы вперёд, а остальные направляет в стороны.
block.ironworld-metal-overflow-gate.name = Металлический избыточный затвор
block.ironworld-metal-overflow-gate.description = Передаёт предметы вперёд, когда это возможно, а при блокировании направляет их в стороны.
block.ironworld-metal-underflow-gate.name = Металлический обратный затвор
block.ironworld-metal-underflow-gate.description = Передаёт предметы в стороны, когда это возможно, а при блокировании направляет их вперёд.
block.ironworld-air-pipe.name = Воздушная труба
block.ironworld-air-pipe.description = Транспортирует жидкости под высоким давлением. Принимает жидкости от труб, жидкостных мостов и перекрёстков или сзади.
block.ironworld-air-router.name = Воздушный маршрутизатор
block.ironworld-air-router.description = Распределяет жидкости под высоким давлением по соседним блокам.
block.ironworld-gas-container.name = Газовый контейнер
block.ironworld-gas-container.description = Хранит и распределяет газ и другие жидкости.

# Drills
block.ironworld-kinetic-drill.name = Кинетический бур
block.ironworld-kinetic-drill.description = Использует кинетическую энергию для извлечения поверхностных металлов.

# Production
block.ironworld-wind-collector.name = Коллектор воздуха
block.ironworld-wind-collector.description = Пассивно собирает воздух из атмосферы.
block.ironworld-iron-melter.name = Железоплавильня
block.ironworld-iron-melter.description = Переплавляет железо в шлак.
block.ironworld-Vacuum-Induction-Melter.name = Вакуумно-индукционная плавильня
block.ironworld-Vacuum-Induction-Melter.description = Переплавляет железо и кобальт в сплав пермендюр.
block.ironworld-steel-factory.name = Завод чёрной стали
block.ironworld-steel-factory.description = Объединяет шлак и кобальт в чёрную сталь с использованием воздуха.
block.ironworld-cement-press.name = Цементный пресс
block.ironworld-cement-press.description = Прессует гравий и шлак в металлический цемент.

# Power
block.ironworld-electrical-node.name = Электрический узел
block.ironworld-electrical-node.description = Соединяет энергетические структуры на небольших расстояниях.
block.ironworld-electrical-battery.name = Электрическая батарея
block.ironworld-electrical-battery.description = Хранит избыток энергии и подаёт его в сеть при дефиците выработки.
block.ironworld-small-geothermal-generator.name = Малый геотермальный генератор
block.ironworld-small-geothermal-generator.description = Вырабатывает энергию из тепла грунта.
block.ironworld-geothermal-generator.name = Геотермальный генератор
block.ironworld-geothermal-generator.description = Вырабатывает больше энергии с одного источника тепла по сравнению с малым генератором.

# Turrets
block.ironworld-coilgun.name = Катушечная пушка
block.ironworld-coilgun.description = Выпускает медленные электромагнитные снаряды по врагам. Одноступенчатая катушечная пушка.
block.ironworld-coilgun-mk2.name = Катушечная пушка Mk2
block.ironworld-coilgun-mk2.description = Выпускает медленные электромагнитные снаряды по врагам. Двухступенчатая катушечная пушка.
block.ironworld-helicalrailgun.name = Винтовая рельсовая пушка
block.ironworld-helicalrailgun.description = Стреляет снарядами по врагам. Гибрид катушечной пушки и рельсотрона. Стреляет быстрее катушечной пушки, но медленнее рельсотрона.
block.ironworld-debug-gun.name = Отладочная пушка
block.ironworld-debug-gun.description = Пушка с безумной дальностью и взрывными осколочными снарядами.

# Walls
block.ironworld-alloy-shield-wall.name = Сплавной щитовой блок
block.ironworld-alloy-shield-wall.description = Ремонтирует себя воздухом после завершения импульса восстановления.
block.ironworld-alloy-shield-wall.details = Требует 5 единиц :ironworld-wind-air: воздуха на импульс восстановления; воздух расходуется только при восстановлении блока.
block.ironworld-reinforced-alloy-shield-wall.name = Усиленный сплавной щитовой блок
block.ironworld-reinforced-alloy-shield-wall.description = Ремонтирует себя воздухом после завершения импульса восстановления.
block.ironworld-reinforced-alloy-shield-wall.details = Требует 5 единиц :ironworld-wind-air: воздуха на импульс восстановления; воздух расходуется только при восстановлении блока.

# Units
unit.ironworld-cage-guard.name = Страж Клетки
unit.ironworld-cage-guard.description = Четырёхногий защитник ядра, вооружённый двумя катушечными пушками.
unit.ironworld-iron-crawler.name = Железный ползун
unit.ironworld-iron-crawler.description = Сегментированный ползун, прокладывающий путь к вражеским сооружениям. Его прочность растёт вместе с длиной.
unit.ironworld-pointer.name = Прицел
unit.ironworld-pointer.description = Ползущий юнит, вооружённый компактной винтовой рельсовой пушкой.
unit.ironworld-scourer.name = Губитель
unit.ironworld-scourer.description = Лунный планер, вооружённый тремя малыми катушечными пушками.
unit.ironworld-skimmer.name = Планер
unit.ironworld-skimmer.description = Бронированная машина с ускорителем, вооружённая вращающейся малой катушечной пушкой.
unit.ironworld-sweeper.name = Метатель
unit.ironworld-sweeper.description = Лунный планер, вооружённый разогнанной катушечной пушкой.
block.ironworld-moon-skimmer-fabricator.name = Фабрикатор лунных планеров
block.ironworld-moon-skimmer-fabricator.description = Производит планеров.

# Environment
block.ironworld-gravel-floor.name = Гравийная поверхность
block.ironworld-gravel-floor.description = Куча острой рыхлой породы с кремниевыми вкраплениями. Буры могут добывать из неё гравий.
block.ironworld-iron-floor.name = Железная поверхность
block.ironworld-iron-floor.description = Твёрдая железная поверхность.
block.ironworld-hot-iron-floor.name = Раскалённая железная поверхность
block.ironworld-hot-iron-floor.description = Нагретая железная поверхность.
block.ironworld-charred-iron-floor.name = Обугленная железная поверхность
block.ironworld-charred-iron-floor.description = Железная поверхность, потемневшая от сильного жара.
block.ironworld-ore-cobalt.name = Кобальтовая руда
block.ironworld-ore-loose-Iron.name = Сыпучая железная руда
block.ironworld-dark-iron-wall.name = Тёмная железная стена
block.ironworld-dark-iron-wall.description = Непроходимая тёмная железная поверхность.
block.ironworld-iron-wall.name = Железная стена
block.ironworld-iron-wall.description = Непроходимая железная поверхность.
block.ironworld-molten-iron.name = Расплавленное железо
block.ironworld-molten-iron.description = Озеро расплавленного железа, обеспечивающее сильное геотермальное тепло.
block.ironworld-molten-iron-warm.name = Теплое расплавленное железо
block.ironworld-molten-iron-warm.description = Расплавленное железо с достаточным геотермальным теплом для работы теплового генератора на половинную мощность.
block.ironworld-molten-iron-hot.name = Горячее расплавленное железо
block.ironworld-molten-iron-hot.description = Расплавленное железо с достаточным геотермальным теплом для работы теплового генератора на три четверти мощности.
